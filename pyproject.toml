[project]
name = "media-analyst-agent"
version = "0.1.0"
description = "Autonomous AI agent that acts as a Junior Media Analyst, querying BigQuery and delivering actionable insights in natural language."
authors = [{ name = "Ana Caroline Demier" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.135.2",
    "uvicorn==0.42.0",
    "langchain==1.2.13",
    "langgraph==1.1.3",
    "langchain-anthropic==1.4.0",
    "google-cloud-bigquery==3.40.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "python-dotenv==1.2.2",
]

[tool.black]
line-length = 88
target-version = ['py310']
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88

[tool.coverage.run]
omit = [
    "main.py",
]

[tool.coverage.report]
exclude_lines = [
    "logger\\.",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
addopts = "-v --cov=app --cov-report=term-missing"
testpaths = ["tests"]

[build-system]
requires = ["setuptools", "wheel"]